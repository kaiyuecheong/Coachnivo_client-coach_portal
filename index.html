<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/png" href="/Favicon-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/Favicon-white.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" id="dynamic-favicon" type="image/png" href="/Favicon-dark.png" />
    <script>
      try {
        var matcher = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (matcher) {
          var updateFavicon = function() {
            var favicon = document.getElementById('dynamic-favicon');
            if (favicon) {
              favicon.href = matcher.matches ? '/Favicon-white.png' : '/Favicon-dark.png';
            }
          };
          updateFavicon();
          if (matcher.addEventListener) {
            matcher.addEventListener('change', updateFavicon);
          } else if (matcher.addListener) {
            matcher.addListener(updateFavicon);
          }
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>CoachNivo — Responsive Web Portal</title>
    <meta name="description" content="CoachNivo web portal - find, book and manage sports coaching sessions across desktop, tablet and mobile." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
